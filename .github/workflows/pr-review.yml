name: PR Review

on:
  workflow_call:
    inputs:
      enable-e2e-coverage-check:
        description: 'Run E2E test coverage check'
        required: false
        default: false
        type: boolean
      coverage-mappings:
        description: 'JSON array of {src_pattern, test_dir, label} for coverage check'
        required: false
        default: '[]'
        type: string
      enable-ai-review:
        description: 'Run AI review'
        required: false
        default: true
        type: boolean
      human-review-paths:
        description: 'JSON array of path patterns requiring human review'
        required: false
        default: '[]'
        type: string
      blocking-severities:
        description: 'Comma-separated severity emojis that block merge'
        required: false
        default: '🔴,🟠'
        type: string
      llm-model:
        description: 'LLM model for review'
        required: false
        default: 'openai/primary'
        type: string
      review-timeout-minutes:
        description: 'Review timeout in minutes'
        required: false
        default: '360'
        type: string

    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      LLM_API_KEY_1:
        required: true
      LLM_API_KEY_2:
        required: true
      LLM_API_KEY_3:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  e2e-coverage-check:
    if: ${{ github.event_name == 'pull_request' && inputs.enable-e2e-coverage-check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check E2E test coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_MAPPINGS: ${{ inputs.coverage-mappings }}
        run: |
          CHANGED_FILES=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')

          FRONTEND_SRC_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^frontend/src/' \
            | grep -E '^frontend/src/(views/|api/|stores/|lib/apollo)' || true)

          if [ -z "$FRONTEND_SRC_CHANGES" ]; then
            echo "No testable frontend source changes — skipping E2E coverage check"
            exit 0
          fi

          echo "Frontend source changes:"
          echo "$FRONTEND_SRC_CHANGES"

          MISSING=()

          check_area() {
            local src_pattern="$1" test_dir="$2" label="$3"
            if echo "$FRONTEND_SRC_CHANGES" | grep -qE "$src_pattern"; then
              if ! echo "$CHANGED_FILES" | grep -qE "^frontend/tests/${test_dir}/.*\.spec\.ts$"; then
                MISSING+=("$label: $src_pattern changed but no tests/${test_dir}/*.spec.ts in PR")
              fi
            fi
          }

          echo "$COVERAGE_MAPPINGS" | python3 -c "
          import sys, json
          for m in json.load(sys.stdin):
              print(f\"{m['src_pattern']}\t{m['test_dir']}\t{m['label']}\")
          " | while IFS=$'\t' read -r src test_dir label; do
            check_area "$src" "$test_dir" "$label"
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::E2E test coverage missing:"
            for msg in "${MISSING[@]}"; do
              echo "  - $msg"
            done
            exit 1
          fi

          echo "E2E test coverage OK — PR includes corresponding test changes"

  review-ai:
    if: ${{ github.event_name == 'pull_request' && inputs.enable-ai-review }}
    needs: [e2e-coverage-check]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: review-ai-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
          permission-checks: read

      - name: Resolve LLM config
        id: llm
        env:
          RAW_MODEL: ${{ inputs.llm-model }}
        run: |
          MODEL="${RAW_MODEL#openai/}"
          MODEL="${MODEL#anthropic/}"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Resolved model: $MODEL"

      - name: Setup LiteLLM proxy
        id: litellm-setup
        shell: bash
        env:
          PRIMARY_KEY_1: ${{ secrets.PRIMARY_API_KEY_1 }}
          PRIMARY_KEY_2: ${{ secrets.PRIMARY_API_KEY_2 }}
          PRIMARY_KEY_3: ${{ secrets.PRIMARY_API_KEY_3 }}
          PRIMARY_BASE: ${{ secrets.PRIMARY_API_BASE }}
          PRIMARY_MODEL: ${{ secrets.PRIMARY_MODEL }}
          SECONDARY_KEY: ${{ secrets.SECONDARY_API_KEY }}
          SECONDARY_BASE: ${{ secrets.SECONDARY_API_BASE }}
          SECONDARY_MODEL: ${{ secrets.SECONDARY_MODEL }}
        run: |
          HOUR_BEIJING=$(( (10#$(date -u +%H) + 8) % 24 ))
          if [ "$HOUR_BEIJING" -ge 9 ] && [ "$HOUR_BEIJING" -lt 18 ]; then
            echo "Beijing $HOUR_BEIJING:00 — working hours, using primary model"
            echo "active_model=primary" >> $GITHUB_OUTPUT
          else
            echo "Beijing $HOUR_BEIJING:00 — off hours, using secondary model"
            echo "active_model=secondary" >> $GITHUB_OUTPUT
          fi
          cat > /tmp/litellm_config.yaml << EOF
          model_list:
            - model_name: primary
              litellm_params:
                model: openai/${PRIMARY_MODEL}
                api_key: ${PRIMARY_KEY_1}
                api_base: ${PRIMARY_BASE}
            - model_name: primary
              litellm_params:
                model: openai/${PRIMARY_MODEL}
                api_key: ${PRIMARY_KEY_2}
                api_base: ${PRIMARY_BASE}
            - model_name: primary
              litellm_params:
                model: openai/${PRIMARY_MODEL}
                api_key: ${PRIMARY_KEY_3}
                api_base: ${PRIMARY_BASE}
            - model_name: secondary
              litellm_params:
                model: openai/${SECONDARY_MODEL}
                api_key: ${SECONDARY_KEY}
                api_base: ${SECONDARY_BASE}
          EOF
          cat >> /tmp/litellm_config.yaml << 'EOF'
          router_settings:
            routing_strategy: simple-shuffle
            num_retries: 3
            allowed_fails: 3
            request_timeout: 120
          general_settings:
            master_key: sk-litellm-proxy
            drop_params: true
          EOF

          docker run -d --name litellm \
            -p 4000:4000 \
            -v /tmp/litellm_config.yaml:/app/config.yaml \
            ghcr.io/berriai/litellm:main-latest \
            --config /app/config.yaml --port 4000 --host 0.0.0.0

          echo "Waiting for LiteLLM proxy to be ready..."
          for i in $(seq 1 60); do
            if curl -sf -H "Authorization: Bearer sk-litellm-proxy" http://localhost:4000/health > /dev/null 2>&1; then
              echo "LiteLLM proxy ready (attempt $i)"
              curl -s -H "Authorization: Bearer sk-litellm-proxy" http://localhost:4000/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::LiteLLM proxy failed to start"
          docker logs litellm 2>&1 | tail -50
          exit 1

      - name: Run Open Code Review
        id: ocr
        uses: alibaba/open-code-review@v1.8.0
        with:
          llm_url: http://localhost:4000/v1
          llm_auth_token: sk-litellm-proxy
          llm_model: ${{ steps.litellm-setup.outputs.active_model }}
          llm_use_anthropic: 'false'
          language: '中文'
          incremental: 'true'
          sticky_summary: 'true'
          github_token: ${{ steps.app-token.outputs.token }}
          ocr_version: '1.8.0'

      - name: Wait for all gates and trigger auto-fix if needed
        id: verdict
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f /tmp/ocr-result.json ]; then
            echo "::error::OCR result file not found"
            exit 1
          fi

          # --- 1. Parse OCR verdict ---
          VERDICT=$(python3 -c "
          import json
          with open('/tmp/ocr-result.json') as f:
              data = json.load(f)
          comments = data.get('comments', [])
          blocking = [c for c in comments if c.get('severity') in ('critical', 'high')]
          medium = [c for c in comments if c.get('severity') == 'medium']
          total = len(comments)
          print(f'Total findings: {total}')
          print(f'Blocking (critical/high): {len(blocking)}')
          print(f'Medium: {len(medium)}')
          if blocking:
              print()
              print('Blocking issues:')
              for c in blocking:
                  sev = c.get('severity', '?')
                  path = c.get('path', '?')
                  line = c.get('start_line', '?')
                  cat = c.get('category', '?')
                  content = c.get('content', '')[:150]
                  print(f'  [{sev}] {path}:{line} ({cat}) — {content}')
          if medium and not blocking:
              print()
              print('Medium issues (not blocking, not auto-fixing):')
              for c in medium:
                  path = c.get('path', '?')
                  line = c.get('start_line', '?')
                  content = c.get('content', '')[:100]
                  print(f'  [medium] {path}:{line} — {content}')
          print(f'BLOCKING={len(blocking)}')
          print(f'MEDIUM={len(medium)}')
          " 2>&1)

          echo "$VERDICT"

          OCR_BLOCKING=$(echo "$VERDICT" | grep '^BLOCKING=' | cut -d= -f2)
          OCR_MEDIUM=$(echo "$VERDICT" | grep '^MEDIUM=' | cut -d= -f2)

          # --- 1b. Bot PR convergent review (Step 4 + Step 5) ---
          PR_AUTHOR=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER --jq '.user.login' 2>/dev/null || echo "")
          IS_BOT_PR="false"
          if echo "$PR_AUTHOR" | grep -qi "bot\|l2-\|ai-bot\|github-actions"; then
            IS_BOT_PR="true"
          fi

          if [ "$IS_BOT_PR" = "true" ] && [ "$OCR_BLOCKING" -gt 0 ]; then
            gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments --paginate 2>/dev/null > /tmp/pr_review_comments.json || echo "[]" > /tmp/pr_review_comments.json
            cat > /tmp/classify_findings.py << 'PYEOF'
          import json
          from collections import defaultdict
          with open('/tmp/ocr-result.json') as f:
              ocr = json.load(f)
          with open('/tmp/pr_review_comments.json') as f:
              comments = json.load(f)
          loc_count = defaultdict(int)
          for c in comments:
              p = c.get('path', '')
              l = c.get('line') or c.get('original_line') or '?'
              loc_count[f"{p}:{l}"] += 1
          carry_over_locs = {k for k, v in loc_count.items() if v >= 2}
          findings = ocr.get('comments', [])
          blocking = [c for c in findings if c.get('severity') in ('critical', 'high')]
          carry_over_high = 0
          new_critical = 0
          new_high = 0
          for c in blocking:
              p = c.get('path', '')
              l = c.get('start_line', '?')
              loc = f"{p}:{l}"
              sev = c.get('severity', '?')
              if loc in carry_over_locs:
                  carry_over_high += 1
              elif sev == 'critical':
                  new_critical += 1
              else:
                  new_high += 1
          print(f"CARRY_OVER_HIGH={carry_over_high}")
          print(f"NEW_CRITICAL={new_critical}")
          print(f"NEW_HIGH={new_high}")
          PYEOF
            CLASSIFICATION=$(python3 /tmp/classify_findings.py 2>/dev/null || echo "")
            CARRY_OVER_HIGH=$(echo "$CLASSIFICATION" | grep '^CARRY_OVER_HIGH=' | cut -d= -f2 || echo "0")
            NEW_CRITICAL=$(echo "$CLASSIFICATION" | grep '^NEW_CRITICAL=' | cut -d= -f2 || echo "0")
            NEW_HIGH=$(echo "$CLASSIFICATION" | grep '^NEW_HIGH=' | cut -d= -f2 || echo "0")
            echo "Bot PR: author=$PR_AUTHOR, carry-over high=$CARRY_OVER_HIGH, new critical=$NEW_CRITICAL, new high=$NEW_HIGH"
            EFFECTIVE_BLOCKING=$((CARRY_OVER_HIGH + NEW_CRITICAL))
            if [ "$CARRY_OVER_HIGH" -ge 3 ]; then
              E2E_OK=$(gh api repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs \
                --jq '[.check_runs[] | select(.name | test("e2e|integration|playwright"; "i"))] | all(.conclusion == "success")' 2>/dev/null || echo "false")
              if [ "$E2E_OK" = "true" ]; then
                echo "Carry-over >=3 + E2E passed -> releasing $CARRY_OVER_HIGH carry-over high as medium"
                EFFECTIVE_BLOCKING=$NEW_CRITICAL
                gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments -f body="🔓 **Carry-over 释放**: $CARRY_OVER_HIGH 个 carry-over high findings 已降级为 medium（连续 ≥3 轮 + E2E 通过 → 判定为风格类/最佳实践类）" 2>/dev/null || true
              fi
            fi
            OCR_BLOCKING=$EFFECTIVE_BLOCKING
            echo "Effective blocking after bot PR logic: $OCR_BLOCKING (was: $(echo "$VERDICT" | grep '^BLOCKING=' | cut -d= -f2))"
          fi

          # --- 2. Get current workflow run's check-run IDs (to exclude self) ---
          MY_CHECK_IDS=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs \
            --jq '[.jobs[].id] | map(tostring) | join(",")' 2>/dev/null || echo "")
          echo "Excluding job IDs from current workflow run: $MY_CHECK_IDS"

          # --- 3. Wait for all other check-runs to complete ---
          echo "Waiting for all other gates to complete..."
          for i in $(seq 1 60); do
            PENDING=$(gh api repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs \
              --jq "[.check_runs[] | select((.name | startswith(\"pr-review\")) | not) | select(.status != \"completed\")] | length" 2>/dev/null || echo "0")
            if [ "$PENDING" -eq 0 ]; then
              echo "All gates completed (waited $((i*10))s)"
              break
            fi
            echo "  $PENDING gate(s) still running... (attempt $i/60)"
            sleep 10
          done

          # --- 4. Collect CI failures ---
          CI_FAILED=$(gh api repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs \
            --jq "[.check_runs[] | select((.name | startswith(\"pr-review\")) | not) | select(.conclusion == \"failure\")] | length" 2>/dev/null || echo "0")

          echo "OCR blocking: $OCR_BLOCKING"
          echo "OCR medium: $OCR_MEDIUM"
          echo "CI failures: $CI_FAILED"

          # --- 5. Trigger auto-fix via @agent comment ---
          if [ "$OCR_BLOCKING" -gt 0 ] || [ "$CI_FAILED" -gt 0 ]; then
            echo "::warning::Found $OCR_BLOCKING OCR blocking + $CI_FAILED CI failures"
            echo "Triggering auto-fix via @agent comment..."
            gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments \
              -f body="@agent" 2>/dev/null || echo "Failed to post @agent comment"
            if [ "$OCR_BLOCKING" -gt 0 ]; then
              echo "::error::OCR review found $OCR_BLOCKING blocking issues"
              exit 1
            fi
            echo "Auto-fix triggered for CI failures (OCR passed)"
            exit 0
          elif [ "$OCR_MEDIUM" -gt 0 ]; then
            echo "All gates passed with $OCR_MEDIUM medium issue(s) — not blocking. Comment '@agent' to manually trigger."
            exit 0
          else
            echo "All gates passed — no issues found"
            exit 0
          fi
