name: Deploy Broken Handler

on:
  workflow_call:
    inputs:
      classification-rules:
        description: 'JSON array of {label, category, action, add-labels, comment} rules'
        required: false
        default: |
          [
            {"label":"error-smoke","category":"code","action":"auto-fix","add-labels":["fix-me"],"comment":"Classified as **code bug** (error-smoke) — auto-fix engaged."},
            {"label":"error-build","category":"infrastructure","action":"l2-try","add-labels":[],"comment":"Classified as **build/flow problem** (error-build) — dispatching L2 (flow-fix mode) to fix L1 build workflow."},
            {"label":"error-deploy","category":"infrastructure","action":"l2-try","add-labels":[],"comment":"Classified as **deploy/flow problem** (error-deploy) — dispatching L2 (flow-fix mode) to fix L1 deploy workflow."},
            {"label":null,"category":"unknown","action":"l2-try","add-labels":[],"comment":"Could not classify this deploy-broken issue. Dispatching L2 (flow-fix mode) to investigate.\n\nIf L2 cannot resolve after 3 rounds, human intervention will be requested."}
          ]
        type: string
      trigger-label:
        description: 'Label that triggers this handler'
        required: false
        default: 'deploy-broken'
        type: string

    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      PAT_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  classify-and-resolve:
    if: github.event.label.name == inputs.trigger-label
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      category: ${{ steps.classify.outputs.category }}
      action: ${{ steps.classify.outputs.action }}
      add_labels: ${{ steps.classify.outputs.add_labels }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Classify deploy-broken issue
        id: classify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RULES_JSON: ${{ inputs.classification-rules }}
        run: |
          LABELS=$(gh issue view $ISSUE_NUMBER -R "$REPO" --json labels --jq '.labels[].name')

          echo "$RULES_JSON" | python3 -c "
          import sys, json, os

          labels = os.environ['LABELS'].split()
          rules = json.load(sys.stdin)

          category = 'unknown'
          add_labels = []
          comment = ''
          action = 'human'

          for rule in rules:
              rule_label = rule.get('label')
              if rule_label is None or rule_label in labels:
                  category = rule['category']
                  add_labels = rule.get('add-labels', [])
                  comment = rule.get('comment', '')
                  action = rule.get('action', 'human')
                  break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'category={category}\n')
              f.write(f'action={action}\n')
              f.write(f'add_labels={\",\".join(add_labels)}\n')

          with open('/tmp/comment.txt', 'w') as f:
              f.write(comment)

          print(f'Classified: {category} (action: {action})')
          "

      - name: Apply classification
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          ADD_LABELS: ${{ steps.classify.outputs.add_labels }}
        run: |
          if [ -n "$ADD_LABELS" ]; then
            gh issue edit $ISSUE_NUMBER -R "$REPO" --add-label "$ADD_LABELS"
          fi
          gh issue comment $ISSUE_NUMBER -R "$REPO" --body-file /tmp/comment.txt

  dispatch-l2:
    name: Dispatch L2 (flow-fix)
    needs: classify-and-resolve
    if: always() && needs.classify-and-resolve.outputs.action == 'l2-try'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PAT_TOKEN availability
        id: check
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "$PAT_TOKEN" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_pat=false" >> $GITHUB_OUTPUT
          fi

      - name: Get issue details
        id: issue
        if: steps.check.outputs.has_pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(gh issue view $ISSUE_NUMBER -R "$REPO" --json body --jq '.body[:2000]')
          {
            echo "body<<ISSUE_EOF"
            echo "$BODY"
            echo "ISSUE_EOF"
          } >> $GITHUB_OUTPUT

      - name: Dispatch L2 capability-resolver (flow-fix mode)
        if: steps.check.outputs.has_pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          FAILURE_TYPE="${{ needs.classify-and-resolve.outputs.category }}"
          ISSUE_BODY="${{ steps.issue.outputs.body }}"

          gh api repos/link-seek/issue-resolver-l2/actions/workflows/capability-resolver.yml/dispatches \
            -X POST \
            -f ref=main \
            -f "inputs[consumer-repo]=${{ github.repository }}" \
            -f "inputs[pr-number]=${{ github.event.issue.number }}" \
            -f "inputs[head-sha]=issue-${{ github.event.issue.number }}" \
            -f "inputs[trigger-mode]=flow-fix" \
            -f "inputs[failure-type]=${FAILURE_TYPE}" \
            -f "inputs[failure-context]=${ISSUE_BODY}" \
            -f "inputs[l2-round]=1" \
            || echo "Failed to dispatch L2"

      - name: Fallback to needs-human (no PAT_TOKEN)
        if: steps.check.outputs.has_pat == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit $ISSUE_NUMBER -R "$REPO" --add-label "needs-human"
          gh issue comment $ISSUE_NUMBER -R "$REPO" --body "⚠️ PAT_TOKEN not available — cannot dispatch L2 automatically. Manual intervention required."
