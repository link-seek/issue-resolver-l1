name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check scripts/ tests/

      - name: Compile check
        run: |
          for f in scripts/*.py; do
            python -m py_compile "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All scripts compile OK"

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest pyyaml

      - name: Run unit tests
        env:
          GITHUB_TOKEN: dummy
        run: pytest tests/ -v

  # NOTE（原则见 PRINCIPLES.md「流程定义权与验证解耦」）：
  # ci 只管 L1 自身（lint + unit）。消费侧 E2E 验证不属于 L1 合入门禁，
  # pipeline-test 已整体删除；消费仓如需链路巡检，按 reusable 模式重建后再由消费侧调用。
