name: Fix

on:
  workflow_call:
    inputs:
      issue-number:
        description: 'Issue number for fix-me mode (empty = PR mode)'
        required: false
        default: ''
        type: string
      pr-number:
        description: 'PR number for auto-fix/continue-fix mode (empty = issue mode)'
        required: false
        default: ''
        type: string
      head-branch:
        description: 'PR head branch (PR mode only)'
        required: false
        default: ''
        type: string
      head-sha:
        description: 'PR head SHA (PR mode only)'
        required: false
        default: ''
        type: string
      max-iterations:
        description: 'Max fix iterations'
        required: false
        default: '10'
        type: string
      human-review-paths:
        description: 'JSON array of path patterns requiring human review'
        required: false
        default: '[]'
        type: string
      llm-model:
        description: 'LLM model'
        required: false
        default: 'openai/glm-5.2'
        type: string
      timeout-minutes:
        description: 'Timeout in minutes (unused, kept for compatibility)'
        required: false
        default: '360'
        type: string

    secrets:
      LLM_API_KEY_1:
        required: true
      LLM_API_KEY_2:
        required: true
      LLM_API_KEY_3:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      TAVILY_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Determine mode and gather context
        id: context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MAX_ITERATIONS: ${{ inputs.max-iterations }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            echo "mode=issue" >> $GITHUB_OUTPUT
            echo "target_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

            ISSUE_BODY=$(gh api repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER --jq '.body' 2>/dev/null || echo "")
            ISSUE_TITLE=$(gh api repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER --jq '.title' 2>/dev/null || echo "")

            echo "fix_context<<CTX_EOF" >> $GITHUB_OUTPUT
            echo "## Issue #$ISSUE_NUMBER: $ISSUE_TITLE" >> $GITHUB_OUTPUT
            echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
            echo "CTX_EOF" >> $GITHUB_OUTPUT

          elif [ -n "$PR_NUMBER" ]; then
            echo "mode=pr" >> $GITHUB_OUTPUT
            echo "target_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
            echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

            # Fetch the latest review summary body. Merge all pages first so
            # sort_by/last operate across the full review set, not per-page.
            REVIEW_BODY=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews \
              --paginate 2>/dev/null \
              | jq -rs '[.[][] | select(.state == "CHANGES_REQUESTED" or .state == "COMMENTED")] | sort_by(.submitted_at) | last | .body // ""' 2>/dev/null || echo "")

            # Fetch ALL inline review comments across ALL reviews (not just one).
            # The pulls/{pr}/comments endpoint returns every review comment on the PR.
            # Dedup by path:line keeping the newest wording, limit to 30 most recent
            # unique findings so the agent gets focused, actionable feedback.
            REVIEW_COMMENTS=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments \
              --paginate 2>/dev/null \
              | jq -rs '[.[][] | {p: .path, l: (.line // .original_line // .position // "?"), b: (.body | sub("<!--[^>]*-->"; "") | sub("^\\s+"; "")), t: .created_at}] | sort_by(.t) | reverse | unique_by(.p + ":" + (.l|tostring)) | .[0:30] | .[] | "\(.p):\(.l) — \(.b[0:300])"' 2>/dev/null || echo "")

            CI_FAILURES=""
            FAILED_CHECKS=$(gh api repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs \
              --jq '.check_runs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' 2>/dev/null)

            # Download workflow run logs from ALL failing runs. The check-run
            # logs API (check-runs/{id}/logs) 404s for GitHub Actions jobs, so
            # we rely on workflow-run logs and actions/jobs/{id}/logs (below).
            # Previously only ONE run was fetched (sort_by(.created_at) | last),
            # which was non-deterministic when multiple runs share a timestamp
            # and frequently missed the run containing the real errors.
            WORKFLOW_LOGS_DIR=$(mktemp -d)
            WORKFLOW_RUN_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=30" \
              --jq '[.workflow_runs[] | select(.conclusion == "failure")] | sort_by(.created_at) | reverse | .[].id' 2>/dev/null || echo "")
            for WORKFLOW_RUN_ID in $WORKFLOW_RUN_IDS; do
              [ -z "$WORKFLOW_RUN_ID" ] && continue
              echo "Fetching workflow run logs for run $WORKFLOW_RUN_ID"
              RUN_ZIP="$WORKFLOW_LOGS_DIR/run-$WORKFLOW_RUN_ID.zip"
              if gh api repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID/logs > "$RUN_ZIP" 2>/dev/null; then
                # Validate it's actually a zip (GitHub returns JSON 404 on
                # failure, which unzip rejects silently).
                if unzip -t -q "$RUN_ZIP" 2>/dev/null; then
                  (cd "$WORKFLOW_LOGS_DIR" && unzip -o -q "$RUN_ZIP" 2>/dev/null || true)
                else
                  rm -f "$RUN_ZIP"
                fi
              fi
            done

            while IFS=$'\t' read -r CHECK_ID CHECK_NAME; do
              [ -z "$CHECK_ID" ] && continue
              echo "CI check failed: $CHECK_NAME (ID: $CHECK_ID)"
              CI_FAILURES+="\n## CI Check Failed: $CHECK_NAME\n"
              ANNOTATIONS=$(gh api repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID/annotations \
                --paginate --jq '.[] | select(.annotation_level == "failure" or .annotation_level == "warning") | "\(.path):\(.start_line // 1) [\(.annotation_level)] \(.message)"' 2>/dev/null || echo "")
              if [ -n "$ANNOTATIONS" ]; then
                CI_FAILURES+="\nStructured annotations:\n\`\`\`\n$ANNOTATIONS\n\`\`\`\n"
              fi

              # Gather per-check logs. The check-runs/{id}/logs endpoint
              # 404s for GitHub Actions jobs, but actions/jobs/{id}/logs
              # works (the check-run ID equals the Actions job ID). We try
              # both and validate the download is a real zip so a 404 JSON
              # body never pollutes the grep output below.
              TMP_LOGS_DIR=$(mktemp -d)
              _fetch_logs() {
                local endpoint="$1" zippath="$2"
                if gh api "$endpoint" > "$zippath" 2>/dev/null; then
                  if unzip -t -q "$zippath" 2>/dev/null; then
                    (cd "$TMP_LOGS_DIR" && unzip -o -q "$zippath" 2>/dev/null || true)
                    return 0
                  fi
                fi
                rm -f "$zippath"
                return 1
              }
              # Primary: actions/jobs/{id}/logs (reliable for Actions jobs).
              _fetch_logs "repos/$GITHUB_REPOSITORY/actions/jobs/$CHECK_ID/logs" "$TMP_LOGS_DIR/job-logs.zip" \
                || _fetch_logs "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID/logs" "$TMP_LOGS_DIR/check-logs.zip" \
                || echo "  (could not fetch per-check logs for $CHECK_NAME)"
              # Supplement with all workflow-run logs (covers cases where the
              # job endpoint is unavailable, e.g. non-Actions check runs).
              if [ -d "$WORKFLOW_LOGS_DIR" ] && find "$WORKFLOW_LOGS_DIR" -name '*.txt' -quit 2>/dev/null | grep -q .; then
                cp -r "$WORKFLOW_LOGS_DIR"/*.txt "$TMP_LOGS_DIR/" 2>/dev/null || true
              fi

              # GraphQL / E2E schema errors are the most common root cause of
              # integration failures but the old grep pattern ("error|fail|...")
              # did NOT match lines like 'Unknown field "X" on type "Query"'.
              # Capture them explicitly, plus general errors with context.
              GRAPHQL_ERRORS=$(grep -rhi \
                "Unknown field\|Unknown type\|Cannot query field\|Did you mean\|Field .* not defined\|Type .* not defined\|GraphQL errors detected\|schema.*error\|introspection" \
                "$TMP_LOGS_DIR" 2>/dev/null | sed 's/^[0-9-]*T[0-9:.]*Z[[:space:]]*//' | sort -u || echo "")
              # General errors: exclude GitHub API 404 JSON ("message": "Not Found")
              # which is noise from failed log fetches, not an actual test error.
              GENERAL_ERRORS=$(grep -rhi -B1 -A5 \
                "error\|fail\|panic\|FAIL:\|assertion\|expected\|but got\|validation FAILED\|No workflow calls" \
                "$TMP_LOGS_DIR" 2>/dev/null \
                | grep -vi '"message".*"Not Found"' \
                | sed 's/^[0-9-]*T[0-9:.]*Z[[:space:]]*//' | tail -120 || echo "")

              if [ -n "$GRAPHQL_ERRORS" ]; then
                CI_FAILURES+="\n### GraphQL / Schema Errors (root cause)\n\`\`\`\n$GRAPHQL_ERRORS\n\`\`\`\n"
              fi
              if [ -n "$GENERAL_ERRORS" ]; then
                CI_FAILURES+="\n### General error log (last 120 lines)\n\`\`\`\n$GENERAL_ERRORS\n\`\`\`\n"
              fi
              if [ -z "$GRAPHQL_ERRORS" ] && [ -z "$GENERAL_ERRORS" ]; then
                CI_FAILURES+="\n(No error lines found in logs)\n"
              fi
              rm -rf "$TMP_LOGS_DIR"
            done <<< "$FAILED_CHECKS"
            rm -rf "$WORKFLOW_LOGS_DIR"

            COMBINED="$REVIEW_BODY"
            if [ -n "$REVIEW_COMMENTS" ]; then
              COMBINED+="\n\n## Inline Review Comments\n$REVIEW_COMMENTS"
            fi
            if [ -n "$CI_FAILURES" ]; then
              COMBINED+="\n\n## CI Test Failures (must fix)\n$CI_FAILURES"
            fi

            # Download playwright test artifacts (error-context.md files contain
            # structured GraphQL errors and DOM state — the richest debug signal).
            # Search across all failing workflow runs for the artifact.
            ARTIFACTS_DIR=$(mktemp -d)
            for _RUN_ID in $WORKFLOW_RUN_IDS; do
              [ -z "$_RUN_ID" ] && continue
              ARTIFACT_ID=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$_RUN_ID/artifacts \
                --jq '[.artifacts[] | select(.name == "playwright-results")] | first | .id' 2>/dev/null || echo "")
              if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
                echo "Downloading playwright-results artifact $ARTIFACT_ID from run $_RUN_ID"
                if gh api repos/$GITHUB_REPOSITORY/actions/runs/$_RUN_ID/artifacts/$ARTIFACT_ID/zip > "$ARTIFACTS_DIR/pw.zip" 2>/dev/null; then
                  (cd "$ARTIFACTS_DIR" && unzip -o -q pw.zip 2>/dev/null || true)
                  ERROR_CONTEXT=$(find "$ARTIFACTS_DIR" -name 'error-context.md' -exec cat {} \; 2>/dev/null | head -200 || echo "")
                  if [ -n "$ERROR_CONTEXT" ]; then
                    COMBINED+="\n\n## Playwright Error Context (from artifacts)\n\`\`\`markdown\n$ERROR_CONTEXT\n\`\`\`"
                  fi
                fi
              fi
            done
            rm -rf "$ARTIFACTS_DIR"

            # Gather PR diff for context (L3 capability upgrade: context-blindness fix)
            PR_DIFF=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files \
              --jq '.[] | "### \(.status): \(.filename)\n\`\`\`diff\n\(.patch // "binary file")\n\`\`\`"' 2>/dev/null | head -200)
            if [ -n "$PR_DIFF" ]; then
              COMBINED+="\n\n## PR Changes (diff)\n$PR_DIFF"
            fi

            echo "fix_context<<CTX_EOF" >> $GITHUB_OUTPUT
            echo -e "$COMBINED" >> $GITHUB_OUTPUT
            echo "CTX_EOF" >> $GITHUB_OUTPUT

          else
            echo "::error::Neither issue-number nor pr-number provided"
            exit 1
          fi

          echo "max_iterations=$MAX_ITERATIONS" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.head_branch || github.event.issue.number && 'main' || '' }}
          fetch-depth: 0
          persist-credentials: true
          path: target-repo

      - name: Check iteration limit (PR mode)
        id: iter-check
        if: steps.context.outputs.mode == 'pr'
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.target_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          MAX_ITERATIONS: ${{ steps.context.outputs.max_iterations }}
          FIX_CONTEXT: ${{ steps.context.outputs.fix_context }}
        run: |
          # Count auto-fix commits. When L2 upgrades L1, the iteration
          # counter should reset so L1 gets a fresh batch of attempts
          # with the new capability. We count only auto-fix commits made
          # AFTER the most recent "L2 Round" PR comment (if any).
          L2_RESET_SHA=""
          L2_COMMENT_DATE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | test("L2 Round|已触发 L2|capability-resolver"))] | sort_by(.created_at) | last | .created_at' 2>/dev/null || echo "")
          if [ -n "$L2_COMMENT_DATE" ] && [ "$L2_COMMENT_DATE" != "null" ]; then
            # Find the first auto-fix commit at or after the L2 comment date.
            L2_RESET_SHA=$(git log --reverse --since="$L2_COMMENT_DATE" --format='%H %s' \
              | grep 'auto-fix:' | head -1 | awk '{print $1}' || echo "")
          fi

          if [ -n "$L2_RESET_SHA" ]; then
            AUTO_FIX_COUNT=$(git log --oneline "${L2_RESET_SHA}^..HEAD" 2>/dev/null | grep "auto-fix:" | wc -l | tr -d ' ')
            echo "Counting auto-fix commits since L2 reset ($L2_RESET_SHA)"
          else
            AUTO_FIX_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$HEAD_SHA&per_page=100" --jq '[.[] | select(.commit.message | startswith("auto-fix:"))] | length' 2>/dev/null || echo "0")
          fi
          echo "auto_fix_count=$AUTO_FIX_COUNT" >> $GITHUB_OUTPUT
          echo "Auto-fix commits on branch: $AUTO_FIX_COUNT (max: $MAX_ITERATIONS)"

          if [ "$AUTO_FIX_COUNT" -ge "$MAX_ITERATIONS" ]; then
            echo "exceeded=true" >> $GITHUB_OUTPUT
            echo "::error::Max auto-fix iterations ($MAX_ITERATIONS) reached (current: $AUTO_FIX_COUNT)"

            # Count L2 rounds from PR comments
            L2_ROUNDS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '[.[] | select(.body | test("L2 Round|已触发 L2|capability-resolver"))] | length' 2>/dev/null || echo "0")
            L2_ROUND=$((L2_ROUNDS + 1))

            # Check if last L2 commit should be reverted (if L2 changed L1 but still failing)
            REVERT_LAST="false"
            LAST_L2_COMMIT=$(gh api "repos/link-seek/issue-resolver-l1/commits?per_page=5" \
              --jq '[.[] | select(.commit.message | startswith("L2: upgrade"))] | length' 2>/dev/null || echo "0")
            if [ "$LAST_L2_COMMIT" -gt "0" ] && [ "$L2_ROUND" -gt "1" ]; then
              REVERT_LAST="true"
            fi

            # L2 round limit: max 3 rounds
            if [ "$L2_ROUND" -gt "3" ]; then
              BODY="🧑 **Human intervention needed**: L2 has run 3 rounds without convergence.
            - PR #${PR_NUMBER} still failing after 3 L2 upgrade cycles
            - Auto-fix commits: ${AUTO_FIX_COUNT}
            - Please review manually."
              gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments -f body="$BODY" 2>/dev/null || true
              echo "::error::L2 round limit (3) exceeded. Human intervention needed."
              exit 1
            fi

            # Dispatch L2 (capability-resolver) to upgrade L1's capability
            echo "Dispatching L2 (capability-resolver) round ${L2_ROUND}/3..."
            gh api repos/link-seek/issue-resolver-l2/actions/workflows/capability-resolver.yml/dispatches \
              -X POST \
              -f ref=main \
              -f "inputs[consumer-repo]=$GITHUB_REPOSITORY" \
              -f "inputs[pr-number]=$PR_NUMBER" \
              -f "inputs[head-sha]=$HEAD_SHA" \
              -f "inputs[l2-round]=$L2_ROUND" \
              -f "inputs[revert-last]=$REVERT_LAST" \
              --raw-field "inputs[ci-failures]=$FIX_CONTEXT" \
              --header "Authorization: token $PAT_TOKEN" \
              || echo "Failed to dispatch L2"

            BODY="⚠️ Auto-fix 已修 ${AUTO_FIX_COUNT} 轮仍未通过。已触发 L2 Round ${L2_ROUND}/3 (revert-last=${REVERT_LAST})。"
            gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments \
              -f body="$BODY"
            exit 1
          else
            echo "exceeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout issue-resolver scripts
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        uses: actions/checkout@v4
        with:
          repository: link-seek/issue-resolver-l1
          ref: main
          path: issue-resolver-scripts
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Configure Git
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        shell: bash
        run: |
          git config --global user.name "ai-bot"
          git config --global user.email "bot@ai-resolver.dev"

      - name: Install anysearch + OCR CLI + CodeGraph
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        shell: bash
        run: |
          # anysearch (web search for L1 agent)
          pip install requests -q
          # OCR CLI (local code review before push)
          npm install -g @alibaba-group/open-code-review 2>&1 | tail -3
          # Configure OCR to use the same LLM as L1
          export OCR_LLM_URL=https://api.modelarts-maas.com/v2
          export OCR_LLM_MODEL=glm-5.2
          echo "OCR_LLM_URL=https://api.modelarts-maas.com/v2" >> $GITHUB_ENV
          echo "OCR_LLM_MODEL=glm-5.2" >> $GITHUB_ENV
          echo "OCR_LLM_TOKEN=${{ secrets.LLM_API_KEY }}" >> $GITHUB_ENV
          # CodeGraph (code knowledge graph for surgical context)
          npm install -g @colbymchenry/codegraph 2>&1 | tail -3
          codegraph version || echo "CodeGraph install may have failed"

      - name: Build CodeGraph index
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        working-directory: target-repo
        shell: bash
        run: |
          codegraph init --quiet 2>&1 || echo "CodeGraph init failed (non-fatal)"
          codegraph status 2>&1 | head -10 || true

      - name: Setup LiteLLM proxy
        if: ${{ steps.context.outputs.mode != 'pr' || steps.iter-check.outputs.exceeded == 'false' }}
        shell: bash
        run: |
          cat > /tmp/litellm_config.yaml << 'EOF'
          model_list:
            - model_name: glm-5.2
              litellm_params:
                model: openai/glm-5.2
                api_key: ${{ secrets.LLM_API_KEY_1 }}
                api_base: https://api.modelarts-maas.com/v2
            - model_name: glm-5.2
              litellm_params:
                model: openai/glm-5.2
                api_key: ${{ secrets.LLM_API_KEY_2 }}
                api_base: https://api.modelarts-maas.com/v2
            - model_name: glm-5.2
              litellm_params:
                model: openai/glm-5.2
                api_key: ${{ secrets.LLM_API_KEY_3 }}
                api_base: https://api.modelarts-maas.com/v2
          router_settings:
            routing_strategy: simple-shuffle
            num_retries: 3
            allowed_fails: 3
            request_timeout: 120
          general_settings:
            master_key: sk-litellm-proxy
            drop_params: true
          EOF

          docker run -d --name litellm \
            -p 4000:4000 \
            -v /tmp/litellm_config.yaml:/app/config.yaml \
            ghcr.io/berriai/litellm:main-latest \
            --config /app/config.yaml --port 4000 --host 0.0.0.0

          echo "Waiting for LiteLLM proxy to be ready..."
          for i in $(seq 1 60); do
            if curl -sf -H "Authorization: Bearer sk-litellm-proxy" http://localhost:4000/health > /dev/null 2>&1; then
              echo "LiteLLM proxy ready (attempt $i)"
              curl -s -H "Authorization: Bearer sk-litellm-proxy" http://localhost:4000/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::LiteLLM proxy failed to start"
          docker logs litellm 2>&1 | tail -50
          exit 1

      - name: Run fix (issue mode)
        if: ${{ steps.context.outputs.mode == 'issue' }}
        shell: bash
        working-directory: target-repo
        env:
          LLM_MODEL: openai/glm-5.2
          LLM_BASE_URL: http://localhost:4000/v1
          LLM_API_KEY: sk-litellm-proxy
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.target_number }}
          REPO_NAME: ${{ github.repository }}
          SEARCH_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENT_ENABLE_BROWSING: "true"
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          uv run --no-project --with openhands-sdk --with openhands-tools --with cryptography --with pyyaml \
            python ../issue-resolver-scripts/scripts/fix_issue.py

      - name: Write fix context to file
        if: ${{ steps.context.outputs.mode == 'pr' && steps.iter-check.outputs.exceeded == 'false' }}
        env:
          FIX_CONTEXT: ${{ steps.context.outputs.fix_context }}
        run: |
          echo -e "$FIX_CONTEXT" > /tmp/fix_context.txt
          echo "Fix context written to /tmp/fix_context.txt ($(wc -c < /tmp/fix_context.txt) bytes)"

      - name: Run fix (PR mode)
        if: ${{ steps.context.outputs.mode == 'pr' && steps.iter-check.outputs.exceeded == 'false' }}
        shell: bash
        working-directory: target-repo
        env:
          LLM_MODEL: openai/glm-5.2
          LLM_BASE_URL: http://localhost:4000/v1
          LLM_API_KEY: sk-litellm-proxy
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_CONTEXT_FILE: /tmp/fix_context.txt
          PR_NUMBER: ${{ steps.context.outputs.target_number }}
          REPO_NAME: ${{ github.repository }}
          ITERATION: ${{ steps.iter-check.outputs.auto_fix_count }}
          HUMAN_REVIEW_PATHS: ${{ inputs.human-review-paths }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          uv run --no-project --with openhands-sdk --with openhands-tools --with cryptography --with pyyaml \
            python ../issue-resolver-scripts/scripts/fix_pr.py

      - name: "Guard: reject workflow file changes (L1 hard limit)"
        if: ${{ steps.context.outputs.mode == 'pr' && steps.iter-check.outputs.exceeded == 'false' }}
        working-directory: target-repo
        run: |
          # L1 硬限制：不能修改消费仓的 .github/workflows/（薄壳）
          WORKFLOW_CHANGES=$(git diff --name-only HEAD 2>/dev/null | grep '^\.github/workflows/' || true)
          if [ -n "$WORKFLOW_CHANGES" ]; then
            echo "::warning::L1 attempted to modify .github/workflows/ (forbidden by architecture):"
            echo "$WORKFLOW_CHANGES"
            git checkout -- .github/workflows/ 2>/dev/null || true
            echo "Reverted workflow file changes (L1 cannot modify thin shell)"
          else
            echo "Guard passed: no workflow file changes detected"
          fi

      - name: Approve pending CI workflows (PR mode)
        if: ${{ steps.context.outputs.mode == 'pr' && steps.iter-check.outputs.exceeded == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.context.outputs.head_branch }}
        run: |
          sleep 15
          for run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_branch=$PR_BRANCH&status=action_required" --jq '.workflow_runs[].id' 2>/dev/null); do
            echo "Approving workflow run $run_id..."
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" -X POST 2>/dev/null && echo "Approved $run_id" || echo "Failed to approve $run_id"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-logs
          path: target-repo/*.log
          retention-days: 7
          if-no-files-found: ignore
