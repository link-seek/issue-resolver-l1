name: Deploy

# 流程: 部署验证（pipeline family: deploy）
# 合并 deploy-pipeline.yml + deploy-broken-handler.yml
# 失败处理内部闭环：分类 → auto-fix 或转人工（L2 已关停 2026-09-18）
# 锚定拓扑: 前端 Cloudflare Pages + 后端 ECS（GHCR→ACR→deploy.sh）。
# OSS 前端门禁/回滚已删除（EAP 前端已迁 CF Pages）。CF 未配置时相关步骤跳过。

on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Image tag to deploy (empty = deploy-broken mode)'
        required: false
        default: ''
        type: string
      deploy-broken-issue:
        description: 'Deploy-broken issue number (empty = normal deploy mode)'
        required: false
        default: ''
        type: string
      runner-label:
        description: 'Self-hosted runner label (e.g. eap-prod)'
        required: false
        default: 'eap-prod'
        type: string
      ghcr-image:
        description: 'GHCR image path'
        required: false
        default: 'ghcr.io/link-seek/eap-backend'
        type: string
      acr-registry:
        description: 'ACR registry URL'
        required: false
        default: 'crpi-fswclfmtgfktdkq7.cn-guangzhou.personal.cr.aliyuncs.com'
        type: string
      acr-namespace:
        description: 'ACR namespace'
        required: false
        default: 'eap-app'
        type: string
      acr-repo:
        description: 'ACR repo name'
        required: false
        default: 'backend'
        type: string
      frontend-url:
        description: 'Frontend public URL for smoke test'
        required: false
        default: 'https://www.xieyucheng.top'
        type: string
      api-url:
        description: 'API public URL for smoke test'
        required: false
        default: 'https://api.xieyucheng.top'
        type: string
      issue-repo:
        description: 'Repo to create issue on failure (owner/repo)'
        required: false
        default: 'link-seek/enterprise-architecture-platform'
        type: string
      deploy-script:
        description: 'Deploy script path on ECS'
        required: false
        default: 'scripts/deploy/deploy.sh'
        type: string
      rollback-script:
        description: 'Rollback script path (empty = skip)'
        required: false
        default: 'scripts/deploy/rollback.sh'
        type: string
      backup-script:
        description: 'Backup script path (empty = skip)'
        required: false
        default: 'scripts/deploy/backup.sh'
        type: string
      consumer-repo:
        description: 'Consumer repo for checkout (owner/repo)'
        required: false
        default: 'link-seek/enterprise-architecture-platform'
        type: string
      # 锚定拓扑: 前端固定 Cloudflare Pages（cf-project 为空 = 跳过 CF 门禁/回滚，
      # 兼容无 CF 前端的消费仓）。
      cf-account-id:
        description: 'Cloudflare account ID for Pages frontend'
        required: false
        default: ''
        type: string
      cf-project:
        description: 'Cloudflare Pages project name for frontend'
        required: false
        default: ''
        type: string
      # Task3 试点：后端 provisionPilotConsumer 渲染模板的四个占位输入，
      # 空 = 不透传（后端用各自默认值）。调用方在 with: 里显式传试点值。
      pilot-repo-name:
        description: 'Pilot consumer repo name (PILOT_REPO_NAME)'
        required: false
        default: ''
        type: string
      pilot-runner:
        description: 'Pilot consumer deploy runner label (PILOT_RUNNER)'
        required: false
        default: ''
        type: string
      pilot-frontend-url:
        description: 'Pilot consumer frontend URL (PILOT_FRONTEND_URL)'
        required: false
        default: ''
        type: string
      pilot-api-url:
        description: 'Pilot consumer API URL (PILOT_API_URL)'
        required: false
        default: ''
        type: string

    secrets:
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false
      APP_SEED_ADMIN_EMAIL:
        required: false
      APP_SEED_ADMIN_PASSWORD:
        required: false
      APP_JWT__SECRET:
        required: false
      SMOKE_TEST_EMAIL:
        required: false
      SMOKE_TEST_PASSWORD:
        required: false
      GHCR_PAT:
        required: false
      PAT_TOKEN:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      APP_SEED_EDITOR_EMAIL:
        required: false
      APP_SEED_EDITOR_PASSWORD:
        required: false
      APP_SEED_STRANGER_EMAIL:
        required: false
      APP_SEED_STRANGER_PASSWORD:
        required: false
      E2E_EDITOR_EMAIL:
        required: false
      E2E_EDITOR_PASSWORD:
        required: false
      E2E_STRANGER_EMAIL:
        required: false
      E2E_STRANGER_PASSWORD:
        required: false
      ALIYUN_ACCESS_KEY_ID:
        required: false
      ALIYUN_ACCESS_KEY_SECRET:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      # Task3 试点：后端 provisionPilotConsumer 用 GitHub App 直连建试点仓，
      # 需把 App 凭证从调用方 secrets 透传到部署环境（declared 才能被传入，
      # 否则调用方 workflow 报 startup_failure）。
      PILOT_GITHUB_APP_ID:
        required: false
      PILOT_GITHUB_APP_KEY:
        required: false
      PILOT_GITHUB_ORG:
        required: false

permissions:
  packages: read
  contents: read
  issues: write

jobs:
  # ═══════════════════════════════════════════════════════════
  # 模式 1: deploy-broken issue 处理
  # ═══════════════════════════════════════════════════════════
  classify-broken:
    name: Classify Deploy-Broken
    if: inputs.deploy-broken-issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      category: ${{ steps.classify.outputs.category }}
      action: ${{ steps.classify.outputs.action }}
      add_labels: ${{ steps.classify.outputs.add_labels }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID || secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Classify deploy-broken issue
        id: classify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.deploy-broken-issue }}
          REPO: ${{ inputs.issue-repo }}
        run: |
          export LABELS=$(gh issue view $ISSUE_NUMBER -R "$REPO" --json labels --jq '.labels[].name')

          RULES='[
            {"label":"error-smoke","category":"code","action":"auto-fix","add-labels":["fix-me"],"comment":"Classified as **code bug** (error-smoke) — auto-fix engaged."},
            {"label":"error-build","category":"infrastructure","action":"needs-human","add-labels":[],"comment":"Classified as **build/flow problem** (error-build) — escalating to human (L2 retired)."},
            {"label":"error-deploy","category":"infrastructure","action":"needs-human","add-labels":[],"comment":"Classified as **deploy/flow problem** (error-deploy) — escalating to human (L2 retired)."},
            {"label":null,"category":"unknown","action":"needs-human","add-labels":[],"comment":"Could not classify. Escalating to human (L2 retired)."}
          ]'

          echo "$RULES" | python3 -c "
          import sys, json, os

          labels = os.environ['LABELS'].split()
          rules = json.load(sys.stdin)

          category = 'unknown'
          add_labels = []
          comment = ''
          action = 'human'

          for rule in rules:
              rule_label = rule.get('label')
              if rule_label is None or rule_label in labels:
                  category = rule['category']
                  add_labels = rule.get('add-labels', [])
                  comment = rule.get('comment', '')
                  action = rule.get('action', 'human')
                  break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'category={category}\n')
              f.write(f'action={action}\n')
              f.write(f'add_labels={\",\".join(add_labels)}\n')

          with open('/tmp/comment.txt', 'w') as f:
              f.write(comment)

          print(f'Classified: {category} (action: {action})')
          "

      - name: Apply classification
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.deploy-broken-issue }}
          REPO: ${{ inputs.issue-repo }}
          ADD_LABELS: ${{ steps.classify.outputs.add_labels }}
        run: |
          if [ -n "$ADD_LABELS" ]; then
            gh issue edit $ISSUE_NUMBER -R "$REPO" --add-label "$ADD_LABELS"
          fi
          gh issue comment $ISSUE_NUMBER -R "$REPO" --body-file /tmp/comment.txt

  escalate-human:
    name: Escalate to Human (L2 retired)
    needs: classify-broken
    if: always() && needs.classify-broken.result == 'success' && needs.classify-broken.outputs.action == 'needs-human'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark needs-human
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.deploy-broken-issue }}
          REPO: ${{ inputs.issue-repo }}
        run: |
          gh issue edit $ISSUE_NUMBER -R "$REPO" --add-label "needs-human" \
            || echo "Failed to add needs-human label"
          gh issue comment $ISSUE_NUMBER -R "$REPO" \
            --body "L2 (capability-resolver) 已于 2026-09-18 关停，此类失败不再自动升级，已转人工介入。"

  # ═══════════════════════════════════════════════════════════
  # 模式 2: 正常部署流程
  # ═══════════════════════════════════════════════════════════
  sync-to-acr:
    name: Sync GHCR -> ACR
    if: inputs.image-tag != ''
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ inputs.image-tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.acr-registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull from GHCR and push to ACR
        env:
          TAG: ${{ inputs.image-tag }}
          GHCR_IMAGE: ${{ inputs.ghcr-image }}
          ACR_REGISTRY: ${{ inputs.acr-registry }}
          ACR_NAMESPACE: ${{ inputs.acr-namespace }}
          ACR_REPO: ${{ inputs.acr-repo }}
        run: |
          GHCR_IMG="${GHCR_IMAGE}:${TAG}"
          ACR_IMG="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

          echo "Pulling $GHCR_IMG ..."
          docker pull "$GHCR_IMG"

          docker tag "$GHCR_IMG" "${ACR_IMG}:${TAG}"
          echo "Pushing to ACR ..."
          docker push "${ACR_IMG}:${TAG}"

      - name: Clean old ACR tags (keep latest 10)
        env:
          ACR_REGISTRY: ${{ inputs.acr-registry }}
          ACR_NAMESPACE: ${{ inputs.acr-namespace }}
          ACR_REPO: ${{ inputs.acr-repo }}
          AUTH: ${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}
        run: |
          REPO="${ACR_NAMESPACE}/${ACR_REPO}"
          TAGS=$(curl -s -u "$AUTH" "https://$ACR_REGISTRY/v2/$REPO/tags/list" | jq -r '.tags[]' | grep -v latest | sort -r)
          COUNT=$(echo "$TAGS" | grep -c . || true)
          echo "Current tags (excl latest): $COUNT"
          if [ "$COUNT" -gt 10 ]; then
            OLD=$(echo "$TAGS" | tail -n $((COUNT - 10)))
            for TAG in $OLD; do
              DIGEST=$(curl -s -I -u "$AUTH" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                "https://$ACR_REGISTRY/v2/$REPO/manifests/$TAG" | grep -i "Docker-Content-Digest" | awk '{print $2}' | tr -d '\r')
              if [ -n "$DIGEST" ]; then
                echo "Deleting old ACR tag: $TAG (digest: $DIGEST)"
                curl -s -X DELETE -u "$AUTH" "https://$ACR_REGISTRY/v2/$REPO/manifests/$DIGEST" || true
              fi
            done
          fi

  backup:
    name: Backup
    needs: sync-to-acr
    runs-on: ${{ inputs.runner-label }}
    if: always() && needs.sync-to-acr.result == 'success' && inputs.backup-script != ''
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.consumer-repo }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run backup script
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          echo "Running backup: ${{ inputs.backup-script }}"
          bash ${{ inputs.backup-script }}

  deploy:
    name: Deploy to ECS
    needs: [sync-to-acr, backup]
    if: always() && needs.sync-to-acr.result == 'success' && needs.backup.result != 'failure'
    runs-on: ${{ inputs.runner-label }}
    environment: production
    outputs:
      deploy-failure: ${{ steps.health.outputs.deploy-failure }}
      deploy-logs: ${{ steps.health.outputs.deploy-logs }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.consumer-repo }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run deploy script
        id: deploy-script
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          ACR_REGISTRY: ${{ inputs.acr-registry }}
          ACR_NAMESPACE: ${{ inputs.acr-namespace }}
          ACR_REPO: ${{ inputs.acr-repo }}
          APP_SEED_ADMIN_EMAIL: ${{ secrets.APP_SEED_ADMIN_EMAIL }}
          APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
          APP_SEED_EDITOR_EMAIL: ${{ secrets.APP_SEED_EDITOR_EMAIL }}
          APP_SEED_EDITOR_PASSWORD: ${{ secrets.APP_SEED_EDITOR_PASSWORD }}
          APP_SEED_STRANGER_EMAIL: ${{ secrets.APP_SEED_STRANGER_EMAIL }}
          APP_SEED_STRANGER_PASSWORD: ${{ secrets.APP_SEED_STRANGER_PASSWORD }}
          APP_JWT__SECRET: ${{ secrets.APP_JWT__SECRET }}
          PILOT_GITHUB_APP_ID: ${{ secrets.PILOT_GITHUB_APP_ID }}
          PILOT_GITHUB_APP_KEY: ${{ secrets.PILOT_GITHUB_APP_KEY }}
          PILOT_GITHUB_ORG: ${{ secrets.PILOT_GITHUB_ORG }}
          PILOT_REPO_NAME: ${{ inputs.pilot-repo-name }}
          PILOT_RUNNER: ${{ inputs.pilot-runner }}
          PILOT_FRONTEND_URL: ${{ inputs.pilot-frontend-url }}
          PILOT_API_URL: ${{ inputs.pilot-api-url }}
        run: |
          echo "=== Deploying tag: $IMAGE_TAG ==="
          bash ${{ inputs.deploy-script }}

      - name: Ensure JWT secret in service
        if: always()
        env:
          APP_JWT__SECRET: ${{ secrets.APP_JWT__SECRET }}
        run: |
          SERVICE_FILE="/etc/systemd/system/eap-backend.service"
          if [ ! -f "$SERVICE_FILE" ]; then
            echo "Service file not found, skipping JWT injection"
            exit 0
          fi
          if grep -q 'APP_JWT__SECRET' "$SERVICE_FILE"; then
            echo "APP_JWT__SECRET already present in service file"
            exit 0
          fi
          if [ -z "$APP_JWT__SECRET" ]; then
            echo "::warning::APP_JWT__SECRET is empty — backend will fail in production mode"
            exit 0
          fi
          echo "Injecting APP_JWT__SECRET into ExecStart of $SERVICE_FILE"
          sed -i "/^ExecStart=/ s| \([^ ][^ ]*\)$| -e APP_JWT__SECRET=${APP_JWT__SECRET} \1|" "$SERVICE_FILE"
          systemctl daemon-reload
          systemctl restart eap-backend
          echo "Service restarted with JWT secret"

      - name: Verify service started
        if: always()
        run: |
          if ! systemctl is-active --quiet eap-backend 2>/dev/null; then
            echo "::error::eap-backend service is not running after deploy script"
            echo "=== Systemd status ==="
            systemctl status eap-backend --no-pager 2>/dev/null || true
            echo "=== Journal (last 30 lines) ==="
            journalctl -u eap-backend --no-pager -n 30 2>/dev/null || true
            echo "deploy-failure=Service not running after deploy script" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "eap-backend service is active"

      - name: Health check (local)
        id: health
        if: always()
        run: |
          echo "=== Health check (up to 90s) ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health 2>/dev/null; then
              echo ""
              echo "Backend healthy!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done
          echo "ERROR: Health check failed after 90s"
          echo "deploy-failure=Health check failed after 90s" >> $GITHUB_OUTPUT
          {
            echo "deploy-logs<<LOGS_EOF"
            echo "=== Podman logs (last 50 lines) ==="
            podman logs eap-backend --tail 50 2>/dev/null || true
            echo "=== Journal (last 50 lines) ==="
            journalctl -u eap-backend --no-pager -n 50 2>/dev/null || true
            echo "LOGS_EOF"
          } >> $GITHUB_OUTPUT
          exit 1

  cf-wait:
    name: Wait CF Pages Frontend
    # 锚定拓扑: 前端在 Cloudflare Pages（main 即生产，push 自动部署）。
    # 等本次发版 commit 的生产部署成功再放行 smoke；CF 未配置则跳过。
    if: always() && inputs.image-tag != '' && inputs.cf-project != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy-id: ${{ steps.wait.outputs.deploy-id }}
    steps:
      - name: Wait for production deployment of this commit
        id: wait
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ inputs.cf-account-id }}
          CF_PROJECT: ${{ inputs.cf-project }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "WARNING: CF token/account 未配，跳过 Pages 门禁"
            exit 0
          fi
          SHA="$(echo "$IMAGE_TAG" | grep -oE '[0-9a-f]{40}' | head -n 1 || true)"
          if [ -z "$SHA" ]; then
            echo "WARNING: image-tag 里无 commit SHA，跳过 Pages 门禁"
            exit 0
          fi
          echo "Waiting for CF Pages production deployment of commit $SHA..."
          for i in $(seq 1 30); do
            RESP="$(curl -sf --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT/deployments?per_page=10" 2>/dev/null || echo '{}')"
            MATCH="$(echo "$RESP" | jq -r --arg sha "$SHA" \
              '[.result[]? | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | .[0] | "\(.latest_stage.status // "unknown")|\(.id // "")|\(.url // "")"' 2>/dev/null || echo 'unknown||')"
            STATUS="$(echo "$MATCH" | cut -d'|' -f1)"
            echo "attempt $i: status=$STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "CF Pages production deployment ready: $(echo "$MATCH" | cut -d'|' -f3)"
              echo "deploy-id=$(echo "$MATCH" | cut -d'|' -f2)" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
              echo "::error::CF Pages production deployment failed for commit $SHA"
              exit 1
            fi
            sleep 20
          done
          echo "::error::CF Pages production deployment not ready within 10 minutes"
          exit 1

  smoke-test:
    name: Smoke Test
    needs: [deploy, cf-wait]
    if: always() && needs.deploy.result == 'success' && (needs.cf-wait.result == 'success' || needs.cf-wait.result == 'skipped')
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 25
    outputs:
      result: ${{ steps.collect-results.outputs.result }}
      failures: ${{ steps.collect-results.outputs.failures }}
    steps:
      - name: Run all smoke tests (collective)
        id: smoke
        run: |
          API_URL="${{ inputs.api-url }}"
          FE_URL="${{ inputs.frontend-url }}"
          FAILURES=""

          echo "=== Test 1: Backend health ==="
          HEALTH=$(curl -sf --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
          echo "Backend health: $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            FAILURES+="Backend health returned HTTP $HEALTH (expected 200)\n"
          fi

          echo "=== Test 2: GraphQL endpoint ==="
          GRAPHQL=$(curl -sf --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" \
            -X POST "$API_URL/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}' 2>/dev/null || echo "000")
          echo "GraphQL endpoint: $GRAPHQL"
          if [ "$GRAPHQL" != "200" ]; then
            FAILURES+="GraphQL endpoint returned HTTP $GRAPHQL (expected 200)\n"
          fi

          echo "=== Test 3: Frontend serves HTML ==="
          FRONTEND=$(curl -sf --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "$FE_URL/" 2>/dev/null || echo "000")
          echo "Frontend: $FRONTEND"
          if [ "$FRONTEND" != "200" ]; then
            FAILURES+="Frontend returned HTTP $FRONTEND (expected 200)\n"
          fi

          echo "=== Test 4: GraphQL data queries ==="
          check_graphql() {
            local name="$1"
            local query="$2"
            echo "--- GraphQL: $name ---"
            RESP=$(curl -sf --connect-timeout 10 --max-time 30 -X POST "$API_URL/graphql" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"$query\"}" 2>/dev/null || echo "")
            if [ -z "$RESP" ]; then
              FAILURES+="GraphQL $name: no response\n"
              return
            fi
            if echo "$RESP" | jq -e '.errors' > /dev/null 2>&1; then
              FAILURES+="GraphQL $name: $(echo "$RESP" | jq -c '.errors')\n"
              return
            fi
            echo "OK: $name"
          }

          check_graphql "organizations" '{ organizations(filters:{deletedAt:{is_null:true}}) { nodes { id name } paginationInfo { total } } }'
          check_graphql "valueStreams" '{ valueStreams { nodes { id name } paginationInfo { total } } }'
          check_graphql "businessCapabilities" '{ businessCapabilities { nodes { id name } paginationInfo { total } } }'
          check_graphql "businessProcesses" '{ businessProcesses { nodes { id name } paginationInfo { total } } }'

          echo "failures<<FAIL_EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILURES" >> $GITHUB_OUTPUT
          echo "FAIL_EOF" >> $GITHUB_OUTPUT

      - name: Resolve E2E ref from image tag
        id: e2e-ref
        run: |
          TAG="${{ inputs.image-tag }}"
          # tag 格式: <timestamp>-<40hex commit sha>；E2E 必须测部署的 commit，
          # 不能测 main HEAD（否则新测试 vs 旧包必挂，如 deploy-broken #503）。
          SHA="$(echo "$TAG" | grep -oE '[0-9a-f]{40}' | head -n 1 || true)"
          if [ -n "$SHA" ]; then
            echo "ref=$SHA" >> $GITHUB_OUTPUT
            echo "E2E will test commit $SHA (from image tag)"
          else
            echo "ref=" >> $GITHUB_OUTPUT
            echo "No SHA in image tag; E2E falls back to default branch"
          fi

      # 前端门禁已移至 cf-wait job（等 CF Pages 生产部署就绪才放行 smoke）。

      - name: Checkout consumer repo for E2E
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.consumer-repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.e2e-ref.outputs.ref }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        id: e2e
        working-directory: frontend
        continue-on-error: true
        env:
          E2E_BASE_URL: ${{ inputs.frontend-url }}
          # 消费仓前端（EAP #544 起）经 E2E_API_URL 直连后端 API；
          # 不传则 E2E 把 frontend-url 当 API 用，撞上前端静态站必挂。
          E2E_API_URL: ${{ inputs.api-url }}
          E2E_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          E2E_STRANGER_EMAIL: ${{ secrets.E2E_STRANGER_EMAIL }}
          E2E_STRANGER_PASSWORD: ${{ secrets.E2E_STRANGER_PASSWORD }}
          # EAP 后端 single-source 只认 APP_SEED_*（E2E_* 回退已删，见 EAP state.rs），
          # 而测试 helpers 同样只读 APP_SEED_*；冒烟 E2E 必须把 APP_SEED_* 透下去，
          # 否则测试回落本地默认值、登录必挂（EAP #691 冒烟 2 failed 根因）。
          APP_SEED_ADMIN_EMAIL: ${{ secrets.APP_SEED_ADMIN_EMAIL }}
          APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
          APP_SEED_EDITOR_EMAIL: ${{ secrets.APP_SEED_EDITOR_EMAIL }}
          APP_SEED_EDITOR_PASSWORD: ${{ secrets.APP_SEED_EDITOR_PASSWORD }}
          APP_SEED_STRANGER_EMAIL: ${{ secrets.APP_SEED_STRANGER_EMAIL }}
          APP_SEED_STRANGER_PASSWORD: ${{ secrets.APP_SEED_STRANGER_PASSWORD }}
        run: |
          echo "Running @smoke tagged tests"
          npx playwright test --grep @smoke

      - name: Collect E2E failures
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "E2E tests failed" >> /tmp/e2e_failure
          echo "failures<<FAIL_EOF" >> $GITHUB_OUTPUT
          cat test-results/*.txt 2>/dev/null || echo "E2E tests failed (see artifacts for details)" >> $GITHUB_OUTPUT
          echo "FAIL_EOF" >> $GITHUB_OUTPUT

      - name: Collect final result
        id: collect-results
        run: |
          API_FAILURES="${{ steps.smoke.outputs.failures }}"
          E2E_RESULT="${{ steps.e2e.outcome }}"

          ALL_FAILURES="$API_FAILURES"
          if [ "$E2E_RESULT" = "failure" ]; then
            ALL_FAILURES+="E2E smoke tests failed (see playwright artifacts)\n"
          fi

          if [ -n "$(echo -e "$ALL_FAILURES" | tr -d '[:space:]')" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "failures<<FAIL_EOF" >> $GITHUB_OUTPUT
            echo -e "$ALL_FAILURES" >> $GITHUB_OUTPUT
            echo "FAIL_EOF" >> $GITHUB_OUTPUT
            echo "::error::Smoke test failures detected"
            exit 1
          else
            echo "result=success" >> $GITHUB_OUTPUT
            echo "failures=" >> $GITHUB_OUTPUT
            echo "All smoke tests passed"
          fi

  rollback:
    name: Rollback
    needs: [deploy, smoke-test]
    runs-on: ${{ inputs.runner-label }}
    if: always() && (needs.smoke-test.result == 'failure' || needs.deploy.result == 'failure') && inputs.rollback-script != ''
    outputs:
      rollback-result: ${{ steps.rollback-status.outputs.result }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.consumer-repo }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run rollback script
        id: rollback-status
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          echo "=== Rolling back ==="
          bash ${{ inputs.rollback-script }}
          echo "result=success" >> $GITHUB_OUTPUT

      - name: Rollback failed
        if: steps.rollback-status.outcome == 'failure'
        run: |
          echo "::error::Rollback failed — manual intervention required"
          echo "result=failure" >> $GITHUB_OUTPUT
          exit 1

  rollback-frontend:
    name: Rollback Frontend (CF Pages)
    needs: rollback
    runs-on: ubuntu-latest
    if: always() && needs.rollback.result == 'success' && inputs.image-tag != '' && inputs.cf-project != ''
    timeout-minutes: 10
    outputs:
      rollback-result: ${{ steps.frontend-rollback.outputs.result }}
    steps:
      - name: Rollback CF Pages to previous production deployment
        id: frontend-rollback
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ inputs.cf-account-id }}
          CF_PROJECT: ${{ inputs.cf-project }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # 回滚到上一个成功的生产部署：跳过本次发版 commit，取最新的 success。
          # CF rollback 即时生效、免重建。
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "WARNING: CF token/account 未配，前端回滚转手动"
            echo "result=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          SHA="$(echo "$IMAGE_TAG" | grep -oE '[0-9a-f]{40}' | head -n 1 || true)"
          if [ -z "$SHA" ]; then
            echo "::error::image-tag 里无 commit SHA，无法定位回滚目标，转手动"
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          LIST="$(curl -sf --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT/deployments?per_page=20" 2>/dev/null || echo '{}')"
          TARGET="$(echo "$LIST" | jq -r --arg sha "$SHA" \
            '[.result[]? | select(.environment == "production" and .latest_stage.status == "success" and .deployment_trigger.metadata.commit_hash != $sha)] | .[0] | "\(.id // "")|\(.url // "")"' 2>/dev/null || echo '|')"
          TARGET_ID="$(echo "$TARGET" | cut -d'|' -f1)"
          if [ -z "$TARGET_ID" ]; then
            echo "::error::No previous CF production deployment found — manual intervention required"
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "Rolling back CF Pages to deployment $TARGET_ID ($(echo "$TARGET" | cut -d'|' -f2))..."
          RB="$(curl -sf --connect-timeout 10 --max-time 60 -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT/deployments/$TARGET_ID/rollback" 2>/dev/null || echo '{}')"
          if [ "$(echo "$RB" | jq -r '.success // false' 2>/dev/null)" = "true" ]; then
            echo "CF Pages rollback completed: $TARGET_ID is production now"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "::error::CF Pages rollback API failed: $(echo "$RB" | jq -c '.errors // []' 2>/dev/null)"
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Frontend rollback failed
        if: steps.frontend-rollback.outcome == 'failure'
        run: |
          echo "::error::Frontend rollback failed — manual intervention required"
          echo "result=failure" >> $GITHUB_OUTPUT
          exit 1

  # ═══════════════════════════════════════════════════════════
  # 失败处理：内部闭环（不再创建 issue 再触发另一个 workflow）
  # ═══════════════════════════════════════════════════════════
  handle-failure:
    name: Handle Deploy Failure
    needs: [deploy, smoke-test, rollback, rollback-frontend, cf-wait]
    runs-on: ubuntu-latest
    if: always() && inputs.image-tag != '' && (needs.smoke-test.result == 'failure' || needs.deploy.result == 'failure' || needs.sync-to-acr.result == 'failure' || needs.cf-wait.result == 'failure')
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID || secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Classify and resolve failure
        id: handle-failure
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SYNC_RESULT: ${{ needs.sync-to-acr.result }}
          CF_WAIT_RESULT: ${{ needs.cf-wait.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          ROLLBACK_OUTPUT: ${{ needs.rollback.outputs.rollback-result }}
          FE_ROLLBACK_RESULT: ${{ needs.rollback-frontend.result }}
          FE_ROLLBACK_OUTPUT: ${{ needs.rollback-frontend.outputs.rollback-result }}
          FAILURES: ${{ needs.smoke-test.outputs.failures }}
          DEPLOY_FAILURE: ${{ needs.deploy.outputs.deploy-failure }}
          DEPLOY_LOGS: ${{ needs.deploy.outputs.deploy-logs }}
          API_URL: ${{ inputs.api-url }}
          FE_URL: ${{ inputs.frontend-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Determine failure type and labels
          LABELS="deploy-broken"
          FAILURE_TYPE="unknown"
          FAILURE_DETAIL=""
          ACTION="needs-human"

          if [ "$SYNC_RESULT" = "failure" ]; then
            LABELS="$LABELS,error-deploy"
            FAILURE_TYPE="acr-sync"
            FAILURE_DETAIL="ACR sync (GHCR -> ACR) failed"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            LABELS="$LABELS,error-deploy"
            FAILURE_TYPE="deploy-script"
            FAILURE_DETAIL="${DEPLOY_FAILURE:-Deploy script or health check failed}"
          elif [ "$CF_WAIT_RESULT" = "failure" ]; then
            LABELS="$LABELS,error-deploy"
            FAILURE_TYPE="cf-pages"
            FAILURE_DETAIL="CF Pages production deployment failed or timed out"
          elif [ "$SMOKE_RESULT" = "failure" ]; then
            if echo "$FAILURES" | grep -qE "Backend health|GraphQL|E2E"; then
              LABELS="$LABELS,error-smoke"
              ACTION="auto-fix"
            else
              LABELS="$LABELS,error-deploy"
            fi
            FAILURE_TYPE="smoke-test"
            FAILURE_DETAIL="${FAILURES:-Smoke test failed}"
          fi

          # Build issue body
          ROLLBACK_NOTE="No rollback configured. Manual intervention required."
          if [ "$ROLLBACK_RESULT" = "success" ] && [ "${ROLLBACK_OUTPUT:-}" = "success" ]; then
            ROLLBACK_NOTE="Rollback completed. Previous version restored."
          elif [ "$ROLLBACK_RESULT" = "success" ] && [ "${ROLLBACK_OUTPUT:-}" = "failure" ]; then
            ROLLBACK_NOTE="Rollback script ran but failed. Manual intervention required."
            LABELS="$LABELS,critical"
          elif [ "$ROLLBACK_RESULT" = "failure" ]; then
            ROLLBACK_NOTE="Rollback failed. Manual intervention required."
            LABELS="$LABELS,critical"
          elif [ "$ROLLBACK_RESULT" = "skipped" ]; then
            ROLLBACK_NOTE="Rollback skipped (no rollback-script configured). Manual intervention required."
            LABELS="$LABELS,critical"
          fi

          FE_ROLLBACK_NOTE="No frontend rollback info."
          if [ "${FE_ROLLBACK_RESULT:-}" = "success" ] && [ "${FE_ROLLBACK_OUTPUT:-}" = "success" ]; then
            FE_ROLLBACK_NOTE="Frontend rollback completed. Previous CF Pages deployment restored."
          elif [ "${FE_ROLLBACK_RESULT:-}" = "success" ] && [ "${FE_ROLLBACK_OUTPUT:-}" = "failure" ]; then
            FE_ROLLBACK_NOTE="Frontend rollback ran but failed. Manual intervention required."
            LABELS="$LABELS,critical"
          elif [ "${FE_ROLLBACK_RESULT:-}" = "failure" ]; then
            FE_ROLLBACK_NOTE="Frontend rollback failed. Manual intervention required."
            LABELS="$LABELS,critical"
          elif [ "${FE_ROLLBACK_RESULT:-}" = "skipped" ]; then
            FE_ROLLBACK_NOTE="Frontend rollback skipped."
          fi

          BODY="## Deploy Failed

          **Image tag**: ${IMAGE_TAG}
          **Failure type**: ${FAILURE_TYPE}
          **Sync result**: ${SYNC_RESULT:-skipped}
          **Deploy result**: ${DEPLOY_RESULT:-skipped}
          **Smoke test**: ${SMOKE_RESULT:-skipped}
          **Rollback**: ${ROLLBACK_RESULT:-skipped}
          **Frontend rollback**: ${FE_ROLLBACK_RESULT:-skipped}

          **API URL**: ${API_URL}
          **Frontend URL**: ${FE_URL}

          ### Failure Details

          ${FAILURE_DETAIL}

          \`\`\`
          ${FAILURES:-${DEPLOY_LOGS:-No details collected}}
          \`\`\`

          ### ${ROLLBACK_NOTE}

          ### ${FE_ROLLBACK_NOTE}

          ### Pipeline run
          [View run](${RUN_URL})"

          # Search for existing open deploy-broken issue for this SHA (dedup by SHA)
          SHORT_TAG="${IMAGE_TAG:0:12}"
          EXISTING=$(gh issue list -R "$ISSUE_REPO" --label deploy-broken --state open --limit 50 --json number,title --jq ".[] | select(.title | contains(\"$SHORT_TAG\")) | .number" 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Found existing deploy-broken issue #$EXISTING for tag $SHORT_TAG, commenting instead of creating new"
            gh issue comment "$EXISTING" -R "$ISSUE_REPO" --body "$BODY" 2>/dev/null
            gh issue edit "$EXISTING" -R "$ISSUE_REPO" --add-label "$LABELS" 2>/dev/null || true
            ISSUE_NUMBER="$EXISTING"
          else
            ISSUE_NUMBER=$(gh issue create -R "$ISSUE_REPO" \
              --title "deploy-broken: ${FAILURE_TYPE} failed (tag ${IMAGE_TAG})" \
              --label "$LABELS" \
              --body "$BODY" 2>/dev/null)
            echo "Created new issue #${ISSUE_NUMBER:-unknown} in ${ISSUE_REPO}"
          fi
          echo "issue_number=${ISSUE_NUMBER:-}" >> $GITHUB_OUTPUT
          echo "action=${ACTION}" >> $GITHUB_OUTPUT
          echo "failure_type=${FAILURE_TYPE}" >> $GITHUB_OUTPUT

      - name: Auto-fix (error-smoke)
        if: always() && steps.handle-failure.outputs.action == 'auto-fix' && steps.handle-failure.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          ISSUE_NUMBER: ${{ steps.handle-failure.outputs.issue_number }}
        run: |
          # Count open deploy-broken + fix-me issues to enforce retry limit (P6)
          FIX_ME_COUNT=$(gh issue list -R "$ISSUE_REPO" --label fix-me --state open --limit 100 --json number --jq 'length' 2>/dev/null || echo 0)
          DEPLOY_BROKEN_COUNT=$(gh issue list -R "$ISSUE_REPO" --label deploy-broken --state open --limit 100 --json number --jq 'length' 2>/dev/null || echo 0)
          TOTAL=$((FIX_ME_COUNT + DEPLOY_BROKEN_COUNT))
          echo "Open fix-me: $FIX_ME_COUNT, deploy-broken: $DEPLOY_BROKEN_COUNT, total: $TOTAL"
          if [ "$TOTAL" -ge 3 ]; then
            echo "Retry limit (3) reached — escalating to needs-human"
            gh issue edit "$ISSUE_NUMBER" -R "$ISSUE_REPO" --add-label "needs-human"
            gh issue comment "$ISSUE_NUMBER" -R "$ISSUE_REPO" \
              --body "Auto-fix retry limit (3) reached. Escalating to manual intervention."
          else
            gh issue edit "$ISSUE_NUMBER" -R "$ISSUE_REPO" --add-label "fix-me"
            gh issue comment "$ISSUE_NUMBER" -R "$ISSUE_REPO" \
              --body "Classified as **code bug** (error-smoke) — auto-fix engaged (attempt $TOTAL of 3)."
          fi

      - name: Escalate to human (L2 retired)
        if: always() && steps.handle-failure.outputs.action == 'needs-human' && steps.handle-failure.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          ISSUE_NUMBER: ${{ steps.handle-failure.outputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" -R "$ISSUE_REPO" --add-label "needs-human" \
            || echo "Failed to add needs-human label"
          gh issue comment "$ISSUE_NUMBER" -R "$ISSUE_REPO" \
            --body "L2 (capability-resolver) 已于 2026-09-18 关停，此类失败不再自动升级，已转人工介入。"

  handle-success:
    name: Handle Deploy Success
    needs: [sync-to-acr, deploy, smoke-test]
    runs-on: ubuntu-latest
    if: always() && inputs.image-tag != '' && needs.smoke-test.result == 'success'
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID || secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Close open deploy-broken issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          ISSUES=$(gh issue list -R "$ISSUE_REPO" --label deploy-broken --state open --json number --jq '.[].number' 2>/dev/null)
          if [ -z "$ISSUES" ]; then
            echo "No open deploy-broken issues to close"
            exit 0
          fi
          for ISSUE in $ISSUES; do
            echo "Closing deploy-broken issue #$ISSUE"
            gh issue comment "$ISSUE" -R "$ISSUE_REPO" \
              --body "Deploy succeeded with tag \`${IMAGE_TAG}\`. Closing this issue." 2>/dev/null
            gh issue close "$ISSUE" -R "$ISSUE_REPO" --reason completed 2>/dev/null
          done
